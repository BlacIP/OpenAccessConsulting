name: Deploy Production to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Builds and pre-renders every page, including 404.html (scripts/build.mjs)
      - name: Build for Production
        run: npm run build -- --mode production
        env:
          # Optional: set under Settings → Secrets and variables → Actions → Variables
          VITE_FORMSPREE_ID: ${{ vars.VITE_FORMSPREE_ID }}
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
        
      - name: Deploy to GitHub Pages (Production)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          cname: openaccessconsult.com     # writes CNAME at branch root
          keep_files: true                 # keep /staging intact
          enable_jekyll: false